name: VaxNurse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Quality Gate, Audits & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Konfiguracja Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności (npm ci)
        run: npm ci

      - name: Kontrola typów TypeScript
        run: |
          npx tsc -b --force --pretty false
          npx tsc -p tsconfig.test.json --noEmit

      - name: Statyczna analiza kodu (Oxlint)
        run: npm run lint

      - name: Build produkcyjny (tworzenie dist/)
        run: npm run build

      - name: Cztery skrypty audytowe (Etap A, Dzieci, Backup, Weryfikacja)
        run: |
          npx tsx scripts/test-foundation-etap-a.mjs
          npx tsx scripts/test-child-vaccinations.mjs
          npx tsx scripts/test-backup-system.mjs
          npx tsx scripts/test-verification-workflow.mjs

      - name: Testy jednostkowe, komponentowe i a11y (Vitest)
        run: npx vitest run

      - name: Instalacja Chromium dla Playwright
        run: npx playwright install --with-deps chromium

      - name: Testy E2E i audyt WCAG 2.2 AA w Chromium (Playwright)
        run: npx playwright test --reporter=list

      - name: Weryfikacja końcowa buildu produkcyjnego
        run: npm run build
